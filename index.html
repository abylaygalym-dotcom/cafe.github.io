<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шаңырақ Café — меню, акции и онлайн-заказ в Алматы</title>
<meta name="description" content="Кафе «Шаңырақ» в Алматы: казахская и европейская кухня, бешбармак, лагман, манты, десерты. Меню с ценами, акции, онлайн-заказ и бронирование стола.">
<meta name="keywords" content="кафе Алматы, меню, бешбармак, лагман, доставка еды, заказ онлайн, Шаңырақ">
<meta property="og:title" content="Шаңырақ Café — вкус дастархана">
<meta property="og:description" content="Меню, акции, онлайн-заказ и бронирование стола. Русский и казахский язык.">
<meta property="og:type" content="restaurant">
<meta name="theme-color" content="#0e3b5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Restaurant","name":"Шаңырақ Café","servesCuisine":["Kazakh","European"],"priceRange":"₸₸","telephone":"+7 727 123-45-67","address":{"@type":"PostalAddress","streetAddress":"пр. Достык, 100","addressLocality":"Алматы","addressCountry":"KZ"},"openingHours":"Mo-Su 09:00-23:00","hasMenu":"#menu","acceptsReservations":"True","inLanguage":["ru","kk"]}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Шаңырақ Café">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#e0a526" stroke-width="3"/><g stroke="#e0a526" stroke-width="2.5" stroke-linecap="round"><path d="M20 4v32M4 20h32M9 9l22 22M31 9L9 31"/></g><circle cx="20" cy="20" r="5" fill="#0e3b5c" stroke="#e0a526" stroke-width="2.5"/></svg>
      <span>Шаңырақ</span>
    </a>
    <nav class="main" id="nav" aria-label="Main">
      <a href="#menu" data-i18n="nav_menu"></a>
      <a href="#specials" data-i18n="nav_special"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#reviews" data-i18n="nav_reviews"></a>
      <a href="#contacts" data-i18n="nav_contacts"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ru" aria-pressed="true">РУС</button>
      <button data-lang="kk" aria-pressed="false">ҚАЗ</button>
    </div>
    <button class="cart-btn" id="cartBtn" aria-label="Cart">🛒 <span class="lbl" data-i18n="cart_btn"></span><span class="n" id="cartN">0</span></button>
    <button class="burger" id="burger" aria-label="Menu">☰</button>
  </div>
</header>

<main id="top">
<section class="hero" style="padding-bottom:0">
  <div class="wrap grid">
    <div>
      <span class="open-pill enter" style="animation-delay:.05s"><i></i><span data-i18n="open_now"></span></span>
      <h1 class="enter" style="animation-delay:.15s" data-i18n="hero_t"></h1>
      <p class="lead enter" style="animation-delay:.3s" data-i18n="hero_s"></p>
      <div class="btns enter" style="animation-delay:.45s">
        <a class="btn gold" href="#menu" data-i18n="cta_menu"></a>
        <a class="btn ghost" href="#contacts" data-i18n="cta_book"></a>
      </div>
      <div class="stats enter" style="animation-delay:.6s">
        <div><b data-count="60" data-plus="1">0</b><span data-i18n="st1"></span></div>
        <div><b data-count="40">0</b><span data-i18n="st2"></span></div>
        <div><b data-count="4.9" data-dec="1">0</b><span data-i18n="st3"></span></div>
      </div>
    </div>
    <div class="plate-wrap enter" style="animation-delay:.35s" aria-hidden="true">
      <div class="orbit"><i>🥟</i><i>🥗</i><i>☕</i><i>🍰</i></div>
      <div class="plate">🍲<div class="steam"><span></span><span></span><span></span></div></div>
    </div>
  </div>
  <div class="orn" aria-hidden="true"></div>
</section>

<div class="ticker" aria-hidden="true"><div id="ticker"></div></div>

<section id="menu">
  <div class="wrap">
    <div class="sec-h">
      <h2 data-i18n="menu_t"></h2>
      <p data-i18n="menu_s"></p>
    </div>
    <div class="tools">
      <div class="search"><input id="q" type="search" data-i18n-ph="search_ph" aria-label="Search"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="note18" id="note18" data-i18n="alc"></div>
    <div class="menu-grid" id="grid" aria-live="polite"></div>
  </div>
</section>

<section id="specials">
  <div class="wrap">
    <div class="sec-h">
      <h2 data-i18n="sp_t"></h2>
      <p data-i18n="sp_s"></p>
    </div>
    <div class="bento" id="bento"></div>
  </div>
</section>

<section id="about">
  <div class="wrap about">
    <div>
      <h2 style="font-size:clamp(28px,4vw,40px)" data-i18n="ab_t"></h2>
      <p data-i18n="ab_p"></p>
      <div class="feats">
        <div class="feat"><div class="ic">🌙</div><div><h3 data-i18n="ab1_t"></h3><p data-i18n="ab1_p"></p></div></div>
        <div class="feat"><div class="ic">🌾</div><div><h3 data-i18n="ab2_t"></h3><p data-i18n="ab2_p"></p></div></div>
        <div class="feat"><div class="ic">👨‍👩‍👧</div><div><h3 data-i18n="ab3_t"></h3><p data-i18n="ab3_p"></p></div></div>
      </div>
    </div>
    <div class="counters">
      <div class="cnt"><b data-count="8">0</b><span data-i18n="c1"></span></div>
      <div class="cnt"><b data-count="15000">0</b><span data-i18n="c2"></span></div>
      <div class="cnt"><b data-count="60" data-plus="1">0</b><span data-i18n="c3"></span></div>
      <div class="cnt"><b data-count="4.9" data-dec="1">0</b><span data-i18n="c4"></span></div>
    </div>
  </div>
</section>

<section id="reviews">
  <div class="wrap">
    <div class="sec-h"><h2 data-i18n="rv_t"></h2><p data-i18n="rv_s"></p></div>
    <div class="rv" id="rv"></div>
  </div>
</section>

<section id="contacts">
  <div class="wrap">
    <div class="sec-h"><h2 data-i18n="ct_t"></h2><p data-i18n="ct_s"></p></div>
    <div class="contact">
      <div class="panel">
        <h3 data-i18n="bk_t"></h3>
        <form id="bkForm" novalidate>
          <div class="row2">
            <div class="fld"><label for="bkName" data-i18n="f_name"></label><input id="bkName" autocomplete="name"><div class="err" data-i18n="e_name"></div></div>
            <div class="fld"><label for="bkPhone" data-i18n="f_phone"></label><input id="bkPhone" type="tel" autocomplete="tel" placeholder="+7 7__ ___-__-__"><div class="err" data-i18n="e_phone"></div></div>
          </div>
          <div class="row2">
            <div class="fld"><label for="bkDate" data-i18n="bk_date"></label><input id="bkDate" type="date"><div class="err" data-i18n="e_date"></div></div>
            <div class="fld"><label for="bkTime" data-i18n="bk_time"></label><input id="bkTime" type="time" value="19:00" min="09:00" max="22:30"></div>
          </div>
          <div class="fld"><label for="bkGuests" data-i18n="bk_guests"></label><input id="bkGuests" type="number" min="1" max="30" value="2"></div>
          <button class="btn gold" type="submit" data-i18n="bk_btn"></button>
        </form>
      </div>
      <div class="panel">
        <h3 data-i18n="addr_t"></h3>
        <ul class="info">
          <li><span>📍</span><div><b data-i18n="addr"></b><small data-i18n="addr_s"></small></div></li>
          <li><span>🕘</span><div><b data-i18n="hrs"></b><small data-i18n="hrs_s"></small></div></li>
          <li><span>📞</span><div><b>+7 (727) 123-45-67</b><small>hello@shanyrak-cafe.kz</small></div></li>
        </ul>
        <h3 data-i18n="fb_t"></h3>
        <form id="fbForm" novalidate>
          <div class="rate" id="rate" role="group" aria-label="Rating"><button type="button" data-v="1">★</button><button type="button" data-v="2">★</button><button type="button" data-v="3">★</button><button type="button" data-v="4">★</button><button type="button" data-v="5">★</button></div>
          <div class="fld"><textarea id="fbText" rows="3" data-i18n-ph="fb_ph" aria-label="Feedback"></textarea><div class="err" data-i18n="e_fb"></div></div>
          <button class="btn red" type="submit" data-i18n="fb_btn"></button>
        </form>
        <div class="socials" style="margin-top:20px">
          <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
          <a href="https://t.me" target="_blank" rel="noopener">Telegram</a>
          <a href="https://wa.me" target="_blank" rel="noopener">WhatsApp</a>
          <a href="https://2gis.kz" target="_blank" rel="noopener">2GIS</a>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="orn" aria-hidden="true"></div>
  <div class="wrap"><span>© 2026 Шаңырақ Café</span><span data-i18n="foot"></span></div>
</footer>

<button class="fab" id="fab"><span>🛒 <span data-i18n="cart_t"></span></span><b id="fabN"></b><b id="fabT"></b></button>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Cart">
  <div class="dh"><h2 data-i18n="cart_t"></h2><button class="x" id="closeCart" aria-label="Close">✕</button></div>
  <div class="db" id="cartBody"></div>
  <div class="df" id="cartFoot">
    <form id="orderForm" novalidate>
      <div class="types" role="radiogroup">
        <label><input type="radio" name="otype" value="delivery" checked>🛵<br><span data-i18n="ty_del"></span></label>
        <label><input type="radio" name="otype" value="pickup">🥡<br><span data-i18n="ty_pick"></span></label>
        <label><input type="radio" name="otype" value="hall">🍽️<br><span data-i18n="ty_hall"></span></label>
      </div>
      <div class="row2">
        <div class="fld"><input id="oName" data-i18n-ph="f_name" aria-label="Name" autocomplete="name"><div class="err" data-i18n="e_name"></div></div>
        <div class="fld"><input id="oPhone" type="tel" data-i18n-ph="f_phone" aria-label="Phone" autocomplete="tel"><div class="err" data-i18n="e_phone"></div></div>
      </div>
      <div class="fld" id="addrFld"><input id="oAddr" data-i18n-ph="f_addr" aria-label="Address" autocomplete="street-address"><div class="err" data-i18n="e_addr"></div></div>
      <div class="fld"><input id="oNote" data-i18n-ph="f_note" aria-label="Comment"></div>
      <div class="sumrow"><span data-i18n="sum"></span><span id="sSub"></span></div>
      <div class="sumrow"><span data-i18n="delv"></span><span id="sDel"></span></div>
      <div class="sumrow tot"><span data-i18n="total"></span><span id="sTot"></span></div>
      <button class="btn gold" type="submit" style="width:100%" data-i18n="place"></button>
    </form>
  </div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mbox">
    <span class="big" id="mEm">🎉</span>
    <h2 id="mT"></h2>
    <p id="mP"></p>
    <p style="font-size:13px" data-i18n="demo"></p>
    <button class="btn gold" id="mClose" data-i18n="close"></button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
